<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM Token — Parque España</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 640px;
            margin: 60px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }
        h2 { color: #333; }
        button {
            background: #1a73e8;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #1558b0; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        textarea {
            width: 100%;
            margin-top: 16px;
            padding: 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #555;
        }
        #status.error { color: #c62828; }
        #status.success { color: #2e7d32; }
        .copy-btn {
            background: #43a047;
            margin-left: 10px;
            padding: 12px 18px;
        }
        .notif-item {
            background: #fff;
            border-left: 4px solid #1a73e8;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 4px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>
    <h2>🔔 FCM Token Generator</h2>
    <p>Genera un token FCM para probar notificaciones push en Parque España.</p>

    <button id="btn" onclick="getToken()">Obtener Token FCM</button>
    <button class="copy-btn" onclick="copyToken()" id="copyBtn" style="display:none">Copiar</button>

    <br>
    <textarea id="token" rows="5" placeholder="El token aparecerá aquí..."></textarea>
    <div id="status"></div>

    <div id="notif-section" style="display:none; margin-top:30px;">
        <h3>📬 Notificaciones recibidas</h3>
        <div id="notifications"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
    <script>
        const VAPID_KEY = 'BAOBBULpHSu1wT72lhWoPWVPLh83rqTuCXuf7oupOZqCFMMXuwTMYPlCXY1buPzK4gAArv-0Tj4KicLpJX59prA'; // ← pega aquí tu VAPID key

        firebase.initializeApp({
            apiKey:            'AIzaSyBD1S8I0lFhuGn2AfeSft-wVltDRy2QxTk',
            authDomain:        'parqueespana-72f8f.firebaseapp.com',
            projectId:         'parqueespana-72f8f',
            storageBucket:     'parqueespana-72f8f.firebasestorage.app',
            messagingSenderId: '775812930675',
            appId:             '1:775812930675:web:36f2ba5752c3d3f03c9e06',
        });

        const messaging = firebase.messaging();

        // Escucha notificaciones cuando la página está en primer plano
        messaging.onMessage((payload) => {
            console.log('Notificación recibida:', payload);

            const list    = document.getElementById('notifications');
            const item    = document.createElement('div');
            item.className = 'notif-item';
            item.innerHTML = `
                <strong>${payload.notification?.title ?? '(sin título)'}</strong><br>
                <span>${payload.notification?.body ?? ''}</span><br>
                <small style="color:#999">${new Date().toLocaleTimeString()}</small>
            `;
            list.prepend(item);
            document.getElementById('notif-section').style.display = 'block';
        });

        async function getToken() {
            const btn    = document.getElementById('btn');
            const status = document.getElementById('status');

            btn.disabled = true;
            status.className = '';
            status.textContent = 'Solicitando permiso...';

            try {
                const permission = await Notification.requestPermission();

                if (permission !== 'granted') {
                    status.className   = 'error';
                    status.textContent = '❌ Permiso de notificaciones denegado. Habilítalo en la configuración del navegador.';
                    btn.disabled = false;
                    return;
                }

                status.textContent = 'Obteniendo token...';

                const token = await messaging.getToken({ vapidKey: VAPID_KEY });

                document.getElementById('token').value = token;
                document.getElementById('copyBtn').style.display = 'inline';
                status.className   = 'success';
                status.textContent = '✅ Token obtenido. Cópialo y regístralo en POST /api/v1/device-token';

            } catch (err) {
                status.className   = 'error';
                status.textContent = '❌ Error: ' + err.message;
                console.error(err);
            }

            btn.disabled = false;
        }

        function copyToken() {
            const textarea = document.getElementById('token');
            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                document.getElementById('status').textContent = '📋 Token copiado al portapapeles';
            });
        }
    </script>
</body>
</html>
